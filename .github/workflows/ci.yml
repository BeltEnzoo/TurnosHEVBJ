name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: turnos
          POSTGRES_PASSWORD: turnos_dev
          POSTGRES_DB: turnos_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turnos -d turnos_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      PUBLIC_APP_URL: http://localhost:3000
      API_URL: http://localhost:3001
      DATABASE_URL: postgresql://turnos:turnos_dev@localhost:5432/turnos_dev
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-must-be-32-chars-min
      FIELD_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      COOKIE_SECURE: "false"
      TRUST_PROXY: "false"
      WHATSAPP_PROVIDER: mock
      ALLOW_DEV_SEED: "true"
      SEED_ADMIN_EMAIL: admin@hospital.local
      SEED_ADMIN_PASSWORD: DevAdmin1234!
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm test
